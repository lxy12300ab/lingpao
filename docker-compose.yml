services:
  app:
    build: .
    image: leap-mileage:local
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /data
      OMP_THREAD_LIMIT: "1"
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    # Some Synology kernels lack CPU CFS quotas; leave CPU unrestricted.
    stop_grace_period: 60s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  nginx:
    image: nginx:1.28-alpine
    environment:
      TZ: Asia/Shanghai
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${BIND_IP:-127.0.0.1}:${HTTP_PORT:-5080}:80"
      - "${HTTPS_BIND_IP:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
