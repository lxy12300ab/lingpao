user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log /var/log/nginx/access.log;
    sendfile on;
    client_max_body_size 16m;
    client_body_timeout 30s;
    limit_req_zone $binary_remote_addr zone=uploads:10m rate=12r/m;
    resolver 127.0.0.11 ipv6=off valid=10s;
    upstream leap { zone leap 64k; server app:8000 resolve; }
    server {
        # HTTP is loopback-only by default, intended for DSM reverse proxy.
        listen 80;
        listen 443 ssl;
        server_name _;
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_hide_header Expires;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        # Optional extra Basic Auth for the entire site:
        # auth_basic "Leap private garage";
        # auth_basic_user_file /etc/nginx/certs/.htpasswd;
        location = /api/health { auth_basic off; proxy_pass http://leap; }
        location = /api/upload {
            limit_req zone=uploads burst=3 nodelay;
            limit_req_status 429;
            proxy_pass http://leap;
        }
        location / { proxy_pass http://leap; }
    }
}
